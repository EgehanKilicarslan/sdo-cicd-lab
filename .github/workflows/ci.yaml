name: C Application CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # TASK 1 — THE GREEN BUILD THAT LIES
  # ============================================================
  # A successful compilation does not guarantee correct behavior.
  #
  # Mission:
  #   Investigate whether the application produces the expected
  #   result when given specific inputs.
  #
  # Your challenge:
  #   Extend this job to verify the application's behavior.
  #   If something fails, use the logs to investigate why.
  #
  # Case file: docs/task1.md
  # ============================================================

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile C application
        run: gcc expo.c -lm -o expo

      # YOUR INVESTIGATION STARTS HERE.
      # What should happen after compilation?

  # ============================================================
  # TASK 2 — THE UNPROTECTED DOCKER BUILD
  # ============================================================
  # The application now has a functional test, but the Docker
  # build has no reason to wait for that test to succeed.
  #
  # Mission A:
  #   Make sure a failing test prevents this job from running.
  #
  # Mission B:
  #   A successful image build does not guarantee that the
  #   container can actually start and run the application.
  #   Find a way to verify its runtime behavior.
  #
  # Case file: docs/task2.md
  # ============================================================

  docker-build:
    # INVESTIGATION:
    # Should this job run independently of the test job?

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: expo:1.0

      # TASK 2 — RUNTIME INVESTIGATION
      # Can the image execute the application successfully?
      # A green Docker build is not enough.

      # ========================================================
      # TASK 3 — KUBERNETES INVESTIGATION
      # ========================================================
      # Your container works locally. Now investigate whether
      # the application can run as a Kubernetes Job.
      #
      # Mission:
      #   Prepare a local Kubernetes environment.
      #   Make the Docker image available to the cluster.
      #   Execute the Job defined in the repository.
      #   Verify its completion and application output.
      #
      # Something may be wrong with the configuration.
      # Collect evidence from Kubernetes before fixing it.
      #
      # Case file: docs/task3.md
      # ========================================================

      # YOUR INVESTIGATION CONTINUES HERE.
      # What needs to happen between building an image
      # and successfully running it inside Kubernetes?
