name: C Application CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # TASK 1 — THE GREEN BUILD THAT LIES
  # ============================================================
  # The application compiles successfully, but does it work?
  #
  # Your mission:
  #   1. Add a functional test after compilation.
  #   2. Run the application with the required inputs.
  #   3. Compare its output with the expected result.
  #   4. Investigate and fix any unexpected behavior.
  #
  # Instructions: docs/task1.md
  # ============================================================

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile C application
        run: gcc expo.c -lm -o expo

      # TASK 1: Add your functional test step here.

  # ============================================================
  # TASK 2 — THE UNPROTECTED DOCKER BUILD
  # ============================================================
  # A successful test should be required before building Docker.
  # A successful image build does not guarantee it can run.
  #
  # Your mission:
  #   1. Make this job depend on the test job.
  #   2. Confirm it is skipped when the test fails.
  #   3. Run the built Docker image with test arguments.
  #   4. Verify its output and investigate runtime failures.
  #
  # Instructions: docs/task2.md
  # ============================================================

  docker-build:
    # TASK 2: Add the required job dependency here.

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: expo:1.0

      # TASK 2: Add a step to run and verify the container.

      # ========================================================
      # TASK 3 — KUBERNETES: FOLLOW THE EVIDENCE
      # ========================================================
      # The Docker container works. Can Kubernetes run it too?
      #
      # Follow these steps in order:
      #   1. Start a temporary Minikube cluster.
      #   2. Load the built Docker image into Minikube.
      #   3. Apply the Kubernetes Job manifest.
      #   4. Wait for the Job to complete.
      #   5. Read the Job logs and verify the output.
      #   6. Collect diagnostics if any step fails.
      #
      # The first run may fail. Use the Kubernetes evidence
      # to identify the problem before changing the manifest.
      #
      # Guided instructions: docs/task3.md
      # ========================================================

      # TASK 3: Add your Kubernetes steps below.
